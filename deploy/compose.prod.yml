services:
  app:
    image: ghcr.io/nvanderploeg/beryl:${BERYL_TAG:-latest}
    restart: unless-stopped
    environment:
      # postgres://user:pw@host:5432/beryl?sslmode=verify-full; hex password (see deploy/README.md).
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in deploy/beryl.env}
      ORIGIN: ${ORIGIN:?set ORIGIN in deploy/beryl.env}
      # Keep in step with client_max_body_size in deploy/nginx.
      BODY_SIZE_LIMIT: ${BERYL_BODY_LIMIT:-8M}
      # Empty: the admin portal and /api/admin answer 404. openssl rand -hex 24
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      ADMIN_BACKUP_DIR: /backups
      # Empty: sign-in is off. The key file is mounted read-only below.
      FIREBASE_SERVICE_ACCOUNT_FILE: ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:+/run/secrets/firebase.json}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      FIREBASE_WEB_API_KEY: ${FIREBASE_WEB_API_KEY:-}
      FIREBASE_AUTH_DOMAIN: ${FIREBASE_AUTH_DOMAIN:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      FIREBASE_APP_ID: ${FIREBASE_APP_ID:-}
      BERYL_IDLE_MS: ${BERYL_IDLE_MS:-}
      BERYL_HEARTBEAT_MS: ${BERYL_HEARTBEAT_MS:-}
      BERYL_WRITES_PER_WINDOW: ${BERYL_WRITES_PER_WINDOW:-}
      BERYL_WRITE_WINDOW_MS: ${BERYL_WRITE_WINDOW_MS:-}
      # Set by deploy/nginx; without it every client shares the proxy's write limit.
      ADDRESS_HEADER: x-real-ip
    ports:
      - '127.0.0.1:3270:3000'
    volumes:
      - backups:/backups
      - ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:-/dev/null}:/run/secrets/firebase.json:ro

volumes:
  backups:
