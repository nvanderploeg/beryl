name: CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgres://beryl:beryl@127.0.0.1:5432/beryl_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beryl
          POSTGRES_PASSWORD: beryl
          POSTGRES_DB: beryl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beryl -d beryl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
