services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5446}:5432'
    environment:
      POSTGRES_USER: beryl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beryl}
      POSTGRES_DB: beryl
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U beryl -d beryl']
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ghcr.io/nvanderploeg/beryl:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${BERYL_PORT:-3270}:3000'
    environment:
      DATABASE_URL: postgres://beryl:${POSTGRES_PASSWORD:-beryl}@db:5432/beryl
      ORIGIN: ${BERYL_ORIGIN:-http://localhost:3270}
      BODY_SIZE_LIMIT: ${BERYL_BODY_LIMIT:-8M}
      # Unset: the admin portal and /api/admin answer 404. At least 16 characters.
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
volumes:
  pgdata:
