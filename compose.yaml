services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - '${MYSQL_PORT:-3326}:3306'
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: speculum
      MYSQL_USER: speculum
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-speculum}
    volumes:
      - mysqldata:/var/lib/mysql
      - ./docker/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD',
          'mysqladmin',
          'ping',
          '-h',
          'localhost',
          '-uroot',
          '-p${MYSQL_ROOT_PASSWORD:-rootpassword}'
        ]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    image: ghcr.io/nvanderploeg/speculum:latest
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${SPECULUM_PORT:-3270}:3000'
    environment:
      DATABASE_URL: mysql://speculum:${MYSQL_PASSWORD:-speculum}@db:3306/speculum
      ORIGIN: ${SPECULUM_ORIGIN:-http://localhost:3270}
      BODY_SIZE_LIMIT: ${SPECULUM_BODY_LIMIT:-8M}
volumes:
  mysqldata:
